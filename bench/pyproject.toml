[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "phostro-bench"
version = "0.1.0"
description = "Milestone 0 face recognition benchmark harness for Photo Courier"
requires-python = ">=3.11"
dependencies = [
    "onnxruntime>=1.17",
    "opencv-python>=4.9",
    "numpy>=1.26",
    "pillow>=10.0",
    "scikit-image>=0.22",
    "click>=8.1",
    "rich>=13.0",
]

[project.scripts]
phostro-bench = "bench.src.bench:cli"

[tool.hatch.build.targets.wheel]
packages = ["bench"]

[tool.uv]
dev-dependencies = []
