app = "phostro-worker-preview"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"
  # Build context is repo root so COPY worker/... paths resolve.
  # Run `flyctl deploy` from the repo root with `--config worker/fly.toml`.

[http_service]
  internal_port = 8000
  force_https = true
  # Keep one machine always running during preview dogfood — cold start
  # races with Fly's proxy timeout (~8s) and ONNX load takes 5-15s.
  # Revisit at v1: scale-to-zero with prewarm endpoint, or accept the cold-start.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1

[env]
  PORT = "8000"
  WORKER_ENV = "production"
