app = "phostro-worker-preview"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"
  # Build context is repo root so COPY worker/... paths resolve.
  # Run `flyctl deploy` from the repo root with `--config worker/fly.toml`.

[http_service]
  internal_port = 8000
  force_https = true
  # Scale-to-zero with suspend: machine pauses on idle, wakes on request.
  # Cron-driven dispatch only calls /detect when a job exists in the queue
  # (claimNextJob returns null on empty), so an idle queue costs nothing.
  # First cron tick after a cold period burns one cycle on the wake (~5-15s ONNX
  # load); the next tick (60s later) succeeds against the warm machine. The
  # job-retry path handles the lost tick automatically.
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1

[env]
  PORT = "8000"
  WORKER_ENV = "production"
